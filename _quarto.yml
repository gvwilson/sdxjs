project:
  type: book
  output-dir: docs

book:
  title: "Software Design by Example"
  repo-url: "https://github.com/gvwilson/sdxjs"
  cover-image: images/sdxjs-cover.png
  cover-image-alt: "Software Design by Example: book cover"
  chapters:
    - index.qmd
    - introduction/index.qmd
    - sysprog/index.qmd
    - async/index.qmd
    - test/index.qmd
    - backup/index.qmd
    - table/index.qmd
    - glob/index.qmd
    - parser/index.qmd
    - templater/index.qmd
    - build/index.qmd
    - layout/index.qmd
    - interp/index.qmd
    - loader/index.qmd
    - style/index.qmd
    - codegen/index.qmd
    - docgen/index.qmd
    - bundler/index.qmd
    - packman/index.qmd
    - vm/index.qmd
    - debugger/index.qmd
    - conclusion/index.qmd
  appendices:
    - license/index.qmd
    - conduct/index.qmd
    - contributing/index.qmd
    - bibliography/index.qmd
    - glossary/index.qmd

bibliography: bibliography/references.bib
csl: mccole/book.csl

filters:
  - mccole/links.lua

shortcodes:
  - mccole/glossary.lua
  - mccole/inc-noh1.lua
  - mccole/shortcodes.lua

format:
  html:
    css: mccole/book.css
    link-citations: true
    theme: cosmo
    toc: true
  pdf:
    documentclass: mccole/krantz
